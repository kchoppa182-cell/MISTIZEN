        <input type="file" class="fileInput" accept="image/*">

        <input id="product-price-0" class="price-input" type="number" placeholder="0.00" min="0" step="0.01">
      </div>

      <div class="controls">
        <div class="stepper">
          <button class="minus" aria-label="Decrease quantity">−</button>
          <span class="qty">1</span>
          <button class="plus" aria-label="Increase quantity">+</button>
        </div>
        <div class="stock"><b class="stockLeft">12</b> in stock</div>
