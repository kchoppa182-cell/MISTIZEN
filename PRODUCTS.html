<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closet | MISTIZEN</title>
  <link rel="stylesheet" href="Frontend.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=Inter:wght@400;500;700;800&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="webCanvas"></canvas>

  <main class="catalog-page">
    <!-- Wishlist toggle badge -->
    <button id="wishlistToggle" class="wishlist-toggle" type="button" aria-label="Open wishlist">
      ♥ <span id="wishlistCount">0</span>
    </button>

    <div class="currency-switcher">
      <label for="currencySelect">Currency</label>
      <select id="currencySelect" class="currency-select" aria-label="Choose currency"></select>
    </div>

    <h1 class="page-title new-arrivals-title">The Closet</h1>

    <!-- Search -->
    <div class="catalog-toolbar">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Search tees, drops, best sellers..." aria-label="Search products">
      </div>
      <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false">Filters ⚙</button>
    </div>

    <!-- Category menu -->
    <nav class="category-menu" aria-label="Product categories">
      <select id="categorySelect" class="category-select" aria-label="Choose category"></select>
    </nav>

    <!-- Filters -->
    <aside id="filterPanel" class="filter-panel" aria-label="Product filters">
      <div class="filter-group">
        <label class="filter-title" for="priceFilter">Price <span id="priceFilterLabel">Max: All</span></label>
        <input id="priceFilter" type="range" min="500" max="2000" step="50" value="">
      </div>
      <div class="filter-group">
        <h3>Size</h3>
        <div class="size-filters">
          <label class="size-filter"><input type="checkbox" value="S"><span>S</span></label>
          <label class="size-filter"><input type="checkbox" value="M"><span>M</span></label>
          <label class="size-filter"><input type="checkbox" value="L"><span>L</span></label>
          <label class="size-filter"><input type="checkbox" value="XL"><span>XL</span></label>
          <label class="size-filter"><input type="checkbox" value="XXL"><span>XXL</span></label>
        </div>
      </div>
      <div class="filter-group">
        <h3>Colour</h3>
        <div class="color-filters">
          <label class="color-filter"><input type="checkbox" value="White"><span>White</span></label>
          <label class="color-filter"><input type="checkbox" value="Black"><span>Black</span></label>
        </div>
      </div>
      <div class="filter-group">
        <h3>Availability</h3>
        <label class="check-filter"><input id="inStockFilter" type="checkbox"><span>In stock only</span></label>
        <label class="check-filter"><input id="onSaleFilter" type="checkbox"><span>On sale</span></label>
      </div>
      <button id="clearFilters" class="clear-filters" type="button">Clear all filters</button>
    </aside>

    <!-- Sort + results -->
    <div class="catalog-meta">
      <p id="resultCount" class="result-count">0 products</p>
      <label class="sort-label" for="sortSelect">Sort
        <select id="sortSelect" class="sort-select">
          <option value="featured">Featured</option>
          <option value="price-low">Price: low to high</option>
          <option value="price-high">Price: high to low</option>
          <option value="rating">Top rated</option>
          <option value="name">Name A–Z</option>
        </select>
      </label>
    </div>

    <!-- Product grid -->
    <div id="productGrid" class="grid"></div>
  </main>

  <!-- Quick view modal -->
  <div id="quickView" class="quick-view" role="dialog" aria-modal="true" aria-label="Product details">
    <div class="quick-view-panel">
      <button class="qv-close" type="button" aria-label="Close">×</button>
      <div id="quickViewBody" class="quick-view-body"></div>
    </div>
  </div>

<!-- Wishlist drawer -->
  <aside id="wishlistDrawer" class="wishlist-drawer" aria-label="Wishlist">
    <div class="drawer-backdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>Wishlist</h2>
        <button class="wishlist-close" type="button" aria-label="Close wishlist">×</button>
      </div>
      <div id="wishlistItems" class="wishlist-items"></div>
    </div>
  </aside>

  <script src="products.js"></script>
  <script src="catalog.js"></script>
  <script src="script.js"></script>
</body>
</html>
