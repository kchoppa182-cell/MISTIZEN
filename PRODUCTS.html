<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOSET | MISTIZEN</title>
  <link rel="stylesheet" href="Frontend.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&display=swap">
</head>
<body>
  <canvas id="webCanvas"></canvas>
  <!-- FRONTEND CONCEPT: product cards are static HTML data. JavaScript enhances
       them with galleries, quantities, local cart storage, and price conversion. -->
  <main>
    <section class="page">
      <div class="currency-switcher">
        <label for="currencySelect">Currency</label>
        <select id="currencySelect" class="currency-select" aria-label="Choose currency"></select>
      </div>
      <h1 class="page-title new-arrivals-title">New Arrivals</h1>
      <div class="grid">
        <article class="card" data-images="assets/products/mistizen-white-flatlay.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="MISTIZEN white graphic T-shirt flat lay"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-0" class="visually-hidden">Product name</label><input id="product-name-0" class="name-input" type="text" value="MISTIZEN WHITE / FLAT LAY" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-0" class="visually-hidden">Product price</label><input id="product-price-0" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
        <article class="card" data-images="assets/products/mistizen-white-worn.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="MISTIZEN white graphic T-shirt worn"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-1" class="visually-hidden">Product name</label><input id="product-name-1" class="name-input" type="text" value="MISTIZEN WHITE / WORN" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-1" class="visually-hidden">Product price</label><input id="product-price-1" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
        <article class="card" data-images="assets/products/mistizen-black-back.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="MISTIZEN black graphic T-shirt back"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-2" class="visually-hidden">Product name</label><input id="product-name-2" class="name-input" type="text" value="MISTIZEN BLACK / BACK" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-2" class="visually-hidden">Product price</label><input id="product-price-2" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
        <article class="card" data-images="assets/products/mistizen-white-back.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="MISTIZEN white graphic T-shirt back studio photo"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-3" class="visually-hidden">Product name</label><input id="product-name-3" class="name-input" type="text" value="MISTIZEN WHITE / BACK" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-3" class="visually-hidden">Product price</label><input id="product-price-3" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
        <article class="card" data-images="assets/products/strike-bandit-black.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="Strike Bandit black T-shirt"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-4" class="visually-hidden">Product name</label><input id="product-name-4" class="name-input" type="text" value="STRIKE BANDIT / BLACK" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-4" class="visually-hidden">Product price</label><input id="product-price-4" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
        <article class="card" data-images="assets/products/strike-bandit-white.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="Strike Bandit white T-shirt"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-5" class="visually-hidden">Product name</label><input id="product-name-5" class="name-input" type="text" value="STRIKE BANDIT / WHITE" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-5" class="visually-hidden">Product price</label><input id="product-price-5" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
        <article class="card" data-images="assets/products/mistizen-white-studio.jpg">
          <label class="frame"><div class="placeholder"><span>Product photo</span></div><img class="preview" alt="MISTIZEN white graphic T-shirt studio photo"><span class="swap">Change photo</span><input type="file" class="fileInput" accept="image/*"></label>
          <div class="name-row"><label for="product-name-6" class="visually-hidden">Product name</label><input id="product-name-6" class="name-input" type="text" value="MISTIZEN WHITE / STUDIO" maxlength="40"></div>
          <div class="price-row"><span>$</span><label for="product-price-6" class="visually-hidden">Product price</label><input id="product-price-6" class="price-input" type="number" min="0" step="0.01"></div>
          <div class="controls"><div class="stepper"><button class="minus" aria-label="Decrease quantity">−</button><span class="qty">1</span><button class="plus" aria-label="Increase quantity">+</button></div><div class="stock"><b class="stockLeft">12</b> in stock</div></div>
          <button class="add-btn">Add to cart</button>
        </article>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
