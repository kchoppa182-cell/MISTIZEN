<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CART</title>
    <link rel="stylesheet" href="Frontend.css">
</head>
<body>
      <canvas id="webCanvas"></canvas>
    <div class="content">
      <!-- FRONTEND CONCEPT: #cartItems is an empty render target; script.js
           creates cart rows from the browser's saved cart data. -->
      <main class="cart-page">
        <h1>Your Cart</h1>
        <div class="currency-switcher">
          <label for="currencySelect">Currency</label>
          <select id="currencySelect" class="currency-select" aria-label="Choose currency"></select>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <p id="cartTotal" class="cart-total"></p>
        <button id="clearCart" class="clear-cart" type="button">Empty cart</button>
        <a class="checkout-button" href="checkout.html">CHECKOUT</a>
        <a class="continue-shopping" href="PRODUCTS.html">Continue to closet</a>
      </main>
    </div>
    
    <script src="script.js"></script>

    
</body>
</html>
