<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | MISTIZEN</title>
  <link rel="stylesheet" href="Frontend.css">
</head>
<body>
  <canvas id="webCanvas"></canvas>
  <div class="content">
    <!-- FRONTEND CONCEPT: JavaScript dynamically inserts the payment fields for
         the selected option and submits the order through a JSON API request. -->
    <main class="checkout-page">
      <a class="checkout-back" href="cart.html">← Back to cart</a>
      <h1>Payment</h1>
      <p class="checkout-total">Order total: <strong id="checkoutTotal">KSh 0.00</strong></p>
      <div class="currency-switcher">
        <label for="currencySelect">Currency</label>
        <select id="currencySelect" class="currency-select" aria-label="Choose currency"></select>
      </div>
      <section class="payment-card" aria-labelledby="paymentTitle">
        <h2>Delivery</h2>
        <div class="delivery-methods" role="radiogroup" aria-label="Delivery option">
          <button class="delivery-method active" type="button" data-delivery="nairobi" data-fee-kes="50">Nairobi<br><small>KSh 50</small></button>
          <button class="delivery-method" type="button" data-delivery="nearby" data-fee-kes="100">Nearby counties<br><small>KSh 100</small></button>
          <button class="delivery-method" type="button" data-delivery="countrywide" data-fee-kes="150">Other Kenya counties<br><small>KSh 150</small></button>
          <button class="delivery-method" type="button" data-delivery="international" data-fee-kes="400">International<br><small>KSh 400</small></button>
        </div>
        <div id="deliveryAddressWrap" class="delivery-address">
          <label for="deliveryPhone">Phone number</label>
          <div class="phone-input-row">
            <select id="deliveryCountryCode" class="phone-country-code" aria-label="Country code">
              <option value="+254">+254 (Kenya)</option>
              <option value="+233">+233 (Ghana)</option>
              <option value="+234">+234 (Nigeria)</option>
              <option value="+256">+256 (Uganda)</option>
              <option value="+255">+255 (Tanzania)</option>
              <option value="+250">+250 (Rwanda)</option>
              <option value="+267">+267 (Botswana)</option>
              <option value="+268">+268 (Eswatini)</option>
              <option value="+265">+265 (Malawi)</option>
              <option value="+260">+260 (Zambia)</option>
              <option value="+263">+263 (Zimbabwe)</option>
              <option value="+27">+27 (South Africa)</option>
              <option value="+1">+1 (USA/Canada)</option>
              <option value="+44">+44 (UK)</option>
              <option value="+91">+91 (India)</option>
              <option value="+61">+61 (Australia)</option>
              <option value="+49">+49 (Germany)</option>
              <option value="+33">+33 (France)</option>
              <option value="+81">+81 (Japan)</option>
              <option value="+971">+971 (UAE)</option>
            </select>
            <input id="deliveryPhone" type="text" inputmode="tel" autocomplete="tel" required placeholder="712 345 678">
          </div>

          <label for="deliveryHouseNumber">House number</label>
          <input id="deliveryHouseNumber" type="text" autocomplete="house-number" required placeholder="e.g. 12A">

          <label for="deliveryAddress1">Address line 1</label>
          <input id="deliveryAddress1" type="text" autocomplete="address-line1" required placeholder="Estate / Building / Street name">

          <label for="deliveryAddress2">Address line 2</label>
          <input id="deliveryAddress2" type="text" autocomplete="address-line2" placeholder="Apartment / Floor / Landmark (optional)">

          <label for="deliveryZip">ZIP code</label>
          <input id="deliveryZip" type="text" inputmode="numeric" autocomplete="postal-code" required placeholder="e.g. 00100">

          <p id="deliveryFeeNote" class="delivery-fee-note">Delivery fee: KSh 50</p>
        </div>
        <hr class="checkout-divider">
        <h2 id="paymentTitle">Choose a payment method</h2>
        <div class="payment-methods" role="radiogroup" aria-label="Payment method">
          <button class="payment-method active" type="button" data-payment="mpesa">M-Pesa</button>
          <button class="payment-method" type="button" data-payment="card">Visa / DTB Card</button>
          <button class="payment-method" type="button" data-payment="paypal">PayPal</button>
          <button class="payment-method" type="button" data-payment="sendwave">Sendwave</button>
        </div>
        <form id="paymentForm" class="payment-form"></form>
        <p id="paymentMessage" class="payment-message" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
